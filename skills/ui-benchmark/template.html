<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI benchmark</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --ink: #1a1a19; --muted: #6b6a66; --line: #e6e5e1; --soft: #f1f0ec;
  --accent: #2f5bd3; --good: #1f8a4c; --bad: #c2362b; --mid: #b07a00;
  --good-bg: #e9f5ee; --bad-bg: #f8d3cf; --mid-bg: #f6eccc;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121211; --panel: #1b1b1a; --ink: #f2f1ee; --muted: #a09f9a; --line: #2c2c2a; --soft: #242422;
          --accent: #7aa2ff; --good: #4fd18b; --bad: #ff7b70; --mid: #f0c04a;
          --good-bg: #1d5236; --bad-bg: #7d2620; --mid-bg: #5c5113; }
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; overflow-wrap: anywhere; }
h1 { font-size: 1.4rem; margin: 0; } h2 { font-size: 1.15rem; margin: 40px 0 12px; } h3 { font-size: 1rem; margin: 0; }
p { margin: 6px 0 0; } .muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; } .rules span { background: var(--soft); border-radius: 99px; padding: 3px 12px; font-size: 14px; }
.rank { display: grid; gap: 8px; }
.rank a { display: grid; grid-template-columns: minmax(110px, 200px) 1fr 64px; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
.track { background: var(--soft); border-radius: 6px; height: 22px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--muted); border-radius: 6px; }
.rank a.target .track i { background: var(--accent); } .rank a.target b::after { content: " (yours)"; color: var(--accent); font-weight: 400; }
.verdict { margin-top: 12px; padding: 10px 14px; background: var(--soft); border-radius: 10px; }
.filter { display: flex; gap: 6px; margin: 4px 0 12px; } .filter button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 12px; font-size: 14px; }
.filter button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.app { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 14px 0; }
.app.target { border-color: var(--accent); }
.app header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 12px; margin-top: 14px; }
figure { margin: 0; } figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
.frame { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--soft); }
.frame img { display: block; width: 100%; height: auto; }
.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #fff; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 4px rgb(0 0 0 / .35); padding: 0; }
.pin.good { background: var(--good); } .pin.bad { background: var(--bad); }
body.only-good .pin.bad, body.only-bad .pin.good { display: none; }
.note { min-height: 1.5em; font-size: 14px; margin-top: 6px; }
.note b.good { color: var(--good); } .note b.bad { color: var(--bad); }
.scores { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; margin-top: 14px; }
.scores span { text-align: center; border-radius: 6px; padding: 4px 0; font-size: 13px; font-weight: 700; background: var(--soft); }
.scores .s3, .scores .s4 { background: var(--good-bg); } .scores .s2 { background: var(--mid-bg); } .scores .s0, .scores .s1 { background: var(--bad-bg); }
.visual { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 8px; margin-top: 12px; font-size: 14px; }
.visual div { background: var(--soft); border-radius: 8px; padding: 8px 10px; } .visual b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 8px 6px; border-top: 1px solid var(--line); } th { color: var(--muted); font-weight: 600; font-size: 13px; }
.fit { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.fit.fits { background: var(--good-bg); } .fit.change { background: var(--mid-bg); } .fit.conflicts { background: var(--bad-bg); }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 16px; }
.slider { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.slider img { display: block; width: 100%; height: auto; }
.slider .before { position: absolute; inset: 0; clip-path: inset(0 50% 0 0); }
.slider .line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--accent); pointer-events: none; }
.slider .lbl { position: absolute; top: 8px; font-size: 12px; font-weight: 700; background: var(--ink); color: var(--panel); padding: 2px 8px; border-radius: 6px; }
.slider input { width: 100%; margin-top: 8px; accent-color: var(--accent); }
.delta { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; margin-top: 10px; font-size: 12px; text-align: center; }
.delta span { border-radius: 6px; padding: 4px 0; background: var(--soft); } .delta .up { background: var(--good-bg); } .delta .down { background: var(--bad-bg); }
.legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
@media (max-width: 560px) { .rank a { grid-template-columns: 1fr 52px; } .rank a .track { grid-column: 1 / -1; grid-row: 2; } }
</style>
</head>

        "x": 80,
        "y": 18,
        "kind": "good",
        "note": "Thread cards in a side panel. The document stays fully visible."
      },
      {
        "x": 30,
        "y": 24,
        "kind": "good",
        "note": "Teal tint marks the commented text, using the new highlight token."
      },
      {
        "x": 77,
        "y": 46,
        "kind": "bad",
        "note": "Second card's reply box isn't designed yet."
      }
    ],
    "scoresAfter": [
      3,
      3,
      3,
      4,
      3,
      4,
      2,
      4,
      3,
      null
    ]
  }
}
</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const H = ['Visibility of system status', 'Match with the real world', 'User control and freedom', 'Consistency and standards', 'Error prevention',
  'Recognition over recall', 'Flexibility and efficiency', 'Minimalist design', 'Error recovery', 'Help and documentation'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const src = s => esc(String(s).startsWith('/') ? 'file://' + String(s).split('/').map(encodeURIComponent).join('/') : s);
// Pin geometry, kinds, fits and scores go into attributes, so they are coerced to numbers or fixed words, never raw.
const num = v => Math.min(100, Math.max(0, Number(v) || 0));
const kind = k => (k === 'good' ? 'good' : 'bad');
const level = v => (Number.isInteger(v) && v >= 0 && v <= 4 ? v : 'na');
const total = s => { const v = s.filter(x => x !== null); return { got: v.reduce((a, b) => a + b, 0), max: v.length * 4 }; };
const pct = s => { const t = total(s); return t.max ? t.got / t.max : 0; };

function shot(sc, key) {
  return `<figure><div class="frame"><img src="${src(sc.src)}" alt="${esc(sc.caption || '')}" loading="lazy">
    ${(sc.pins || []).map((p, i) => `<button class="pin ${kind(p.kind)}" style="left:${num(p.x)}%;top:${num(p.y)}%" data-k="${key}" data-i="${i}" aria-label="${kind(p.kind)} point ${i + 1}">${i + 1}</button>`).join('')}
    </div><figcaption>${esc(sc.caption || '')}</figcaption><p class="note" aria-live="polite"></p></figure>`;
}
function scoreRow(s, cls = 'scores') {
  return `<div class="${cls}">${s.map((v, i) => `<span class="s${level(v)}" title="${i + 1}. ${H[i]}">${level(v) === 'na' ? 'n/a' : v}</span>`).join('')}</div>`;
}

const ranked = [...D.apps].sort((a, b) => pct(b.scores) - pct(a.scores));
const pins = {};
let html = `<h1>${esc(D.title)}</h1><p class="muted">${esc(D.feature)}. Flow compared: <b>${esc(D.flow)}</b>.</p>
  <div class="rules">${(D.constraints || []).map(c => `<span>${esc(c)}</span>`).join('')}</div>
  <h2>Ranking</h2><div class="rank">${ranked.map(a => { const t = total(a.scores); return `<a href="#${esc(encodeURIComponent(a.name))}" class="${a.target ? 'target' : ''}"><b>${esc(a.name)}</b><span class="track"><i style="width:${Math.round(pct(a.scores) * 100)}%"></i></span><span>${t.got}/${t.max}</span></a>`; }).join('')}</div>
  ${D.userVerdict ? `<p class="verdict"><b>Your verdict:</b> ${esc(D.userVerdict)}</p>` : ''}
  <p class="legend">Scores: Nielsen's 10 heuristics, 0 to 4 each, the same rubric for every app. Hover a cell for its heuristic.</p>
  <h2>Side by side</h2>
  <div class="filter" role="group" aria-label="Show pins"><button aria-pressed="true" data-f="">All points</button><button aria-pressed="false" data-f="only-good">Good</button><button aria-pressed="false" data-f="only-bad">Bad</button></div>`;
ranked.forEach((a, ai) => {
  html += `<section class="app ${a.target ? 'target' : ''}" id="${esc(encodeURIComponent(a.name))}"><header><h3>${ai + 1}. ${esc(a.name)}${a.target ? ' (yours)' : ''}</h3><span class="muted">${esc(a.why || '')}</span></header>
    <p>${esc(a.verdict || '')}</p>
    <div class="shots">${a.screens.map((sc, si) => { pins[`${ai}-${si}`] = sc.pins || []; return shot(sc, `${ai}-${si}`); }).join('')}</div>
    ${scoreRow(a.scores)}
    <div class="visual">${['color', 'type', 'layout', 'states'].filter(k => a.visual?.[k]).map(k => `<div><b>${k[0].toUpperCase() + k.slice(1)}</b>${esc(a.visual[k])}</div>`).join('')}</div></section>`;
});
if (D.borrow?.length) {
  const fitLabel = { fits: 'Fits DESIGN.md', change: 'Needs a DESIGN.md change', conflicts: 'Conflicts, dropped' };
  html += `<h2>What to borrow</h2><table><thead><tr><th>Idea</th><th>From</th><th>Where it lands</th><th>Fit</th></tr></thead><tbody>${D.borrow.map(b => `<tr><td>${esc(b.idea)}</td><td>${esc(b.from)}</td><td>${esc(b.lands)}${b.designRef ? `<br><span class="muted">${esc(b.designRef)}</span>` : ''}</td><td><span class="fit ${fitLabel[b.fit] ? b.fit : ''}">${fitLabel[b.fit] || esc(b.fit)}</span></td></tr>`).join('')}</tbody></table>`;
}
if (D.compare) {
  const c = D.compare, target = D.apps.find(a => a.target);
  pins.after = c.pins || [];
  html += `<h2>Before and after</h2><div class="compare">
    <figure><div class="slider"><img src="${src(c.after)}" alt="After">
      <div class="before"><img src="${src(c.before)}" alt="Before"></div><div class="line"></div>
      <span class="lbl" style="left:8px">Before</span><span class="lbl" style="right:8px">After</span></div>
      <input type="range" min="0" max="100" value="50" aria-label="Drag to compare before and after"></figure>
    <figure><div class="frame"><img src="${src(c.after)}" alt="After, annotated">${pins.after.map((p, i) => `<button class="pin ${kind(p.kind)}" style="left:${num(p.x)}%;top:${num(p.y)}%" data-k="after" data-i="${i}" aria-label="${kind(p.kind)} point ${i + 1}">${i + 1}</button>`).join('')}</div>
      <figcaption>After, annotated</figcaption><p class="note" aria-live="polite"></p></figure>
    ${c.reference ? `<figure><div class="frame"><img src="${src(c.reference)}" alt="Reference"></div><figcaption>Best reference: ${esc(c.referenceApp || '')}</figcaption></figure>` : ''}</div>`;
  if (c.scoresAfter && target) {
    const b = total(target.scores), a = total(c.scoresAfter);
    html += `<p><b>Score:</b> ${b.got}/${b.max} → ${a.got}/${a.max}</p><div class="delta">${c.scoresAfter.map((v, i) => { const d = (v ?? 0) - (target.scores[i] ?? 0); return `<span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}" title="${H[i]}">${d > 0 ? '+' + d : d}</span>`; }).join('')}</div>`;
  }
}
const app = document.getElementById('app');
app.innerHTML = html;
document.title = D.title;

app.addEventListener('click', e => {
  const p = e.target.closest('.pin');
  if (p) {
    const pin = pins[p.dataset.k][+p.dataset.i];
    p.closest('figure').querySelector('.note').innerHTML = `<b class="${kind(pin.kind)}">${p.dataset.i * 1 + 1}. ${kind(pin.kind) === 'good' ? 'Good' : 'Bad'}:</b> ${esc(pin.note)}`;
  }
  const f = e.target.closest('.filter button');
  if (f) {
    document.querySelectorAll('.filter button').forEach(b => b.setAttribute('aria-pressed', b === f));
    document.body.className = f.dataset.f;
  }
});
const range = app.querySelector('.compare input[type=range]');
if (range) range.oninput = () => {
  app.querySelector('.slider .before').style.clipPath = `inset(0 ${100 - range.value}% 0 0)`;
  app.querySelector('.slider .line').style.left = range.value + '%';
};
</script>
</body>
</html>
